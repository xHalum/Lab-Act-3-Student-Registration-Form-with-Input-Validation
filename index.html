<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <section class="card" aria-labelledby="pageTitle">
            <header class="header">
                <h4>IT SEMINAR • 1ST SEMESTER • A.Y. 2026–2027</h4>
                <h1 id="pageTitle">Student Registration</h1>
                <p class="subtitle">Enter your information below to register for the upcoming IT seminar.</p>
            </header>

            <form id="registrationForm" novalidate>
                <div class="form-grid">
                    <div class="field full">
                        <label for="fullName">Full name</label>
                        <input type="text" id="fullName" name="fullName" aria-describedby="fullNameError" aria-invalid="false" autocomplete="name">
                        <p class="error" id="fullNameError" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="studentNumber">Student number</label>
                        <input type="text" id="studentNumber" name="studentNumber" placeholder="24-1234-123" aria-describedby="studentNumberError" aria-invalid="false" autocomplete="off">
                        <p class="error" id="studentNumberError" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="student@example.com" aria-describedby="emailError" aria-invalid="false" autocomplete="email">
                        <p class="error" id="emailError" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="mobileNumber">Mobile number</label>
                        <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="09171234567" aria-describedby="mobileNumberError" aria-invalid="false" autocomplete="tel">
                        <p class="error" id="mobileNumberError" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="course">Course</label>
                        <select id="course" name="course" aria-describedby="courseError" aria-invalid="false">
              <option value="">Select your course.</option>
              <option value="BSIT">BSIT</option>
              <option value="BSCS">BSCS</option>
            </select>
                        <p class="error" id="courseError" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" aria-describedby="passwordFeedback passwordError" aria-invalid="false" autocomplete="new-password">
                        <p class="feedback" id="passwordFeedback" aria-live="polite"></p>
                        <p class="error" id="passwordError" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" aria-describedby="confirmPasswordError" aria-invalid="false" autocomplete="new-password">
                        <p class="error" id="confirmPasswordError" aria-live="polite"></p>
                    </div>

                    <div class="field full terms-field">
                        <div class="checkbox-row">
                            <input type="checkbox" id="terms" name="terms" aria-describedby="termsError" aria-invalid="false">
                            <label for="terms">I agree to the terms and conditions.</label>
                        </div>
                        <p class="error" id="termsError" aria-live="polite"></p>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="registerBtn" class="btn btn-primary">Register</button>
                    <button type="reset" id="resetBtn" class="btn btn-secondary">Reset</button>
                </div>

                <p class="success" id="successMessage" role="status" aria-live="polite"></p>

                <section id="registrationSummary" class="summary" aria-labelledby="summaryTitle" hidden>
                    <h2 id="summaryTitle">Registration Summary</h2>
                    <dl>
                        <div><dt>Full name</dt>
                            <dd id="summaryName"></dd>
                        </div>
                        <div><dt>Student number</dt>
                            <dd id="summaryStudentNumber"></dd>
                        </div>
                        <div><dt>Email</dt>
                            <dd id="summaryEmail"></dd>
                        </div>
                        <div><dt>Mobile number</dt>
                            <dd id="summaryMobileNumber"></dd>
                        </div>
                        <div><dt>Course</dt>
                            <dd id="summaryCourse"></dd>
                        </div>
                    </dl>
                </section>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
